name: Deploy to Firebase Hosting on push to UAT
'on':
  push:
    branches:
      - uat
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci && npm run build
      - uses: FirebaseExtended/action-hosting-deploy@v0
        id: deploy
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_OLFATIMACHURCH_B8123 }}'
          channelId: uat
          projectId: olfatimachurch-b8123
      - name: UAT preview URL
        run: echo "UAT site → ${{ steps.deploy.outputs.details_url }}"
